    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.ur.apps.walk'
    compileSdk 36

    defaultConfig {
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": "$projectDir/schemas"
                ]
            }
        }
        applicationId "com.ur.apps.walk"
        minSdk 28
        targetSdk 35
        versionCode 100204
        versionName "1.2.4"

        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


        ndk {
            abiFilters  'armeabi-v7a','arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file('keystore/release.keystore')
            storePassword 'unlimitedrefills2025'
            keyAlias 'unlimited_refills'
            keyPassword 'unlimitedrefills2025'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true           // 开启代码混淆
            shrinkResources true         // 移除未使用的资源
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // 版本号 - 使用variant.versionName而不是variant.mergedFlavor.versionName
            def version = variant.versionName

            // 版本代码
            def code = variant.versionCode

            // 构建类型（debug / release）
            def buildType = variant.buildType.name

            // 最终输出 APK 名
            output.outputFileName = "WalkWinCash_${buildType}_${version}_${code}.apk"
        }
    }
    compileOptions {
        sourceCompatibility = libs.versions.jdkRelease.get()
        targetCompatibility = libs.versions.jdkRelease.get()
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packagingOptions.doNotStrip "*/arm64-v8a/libdu.so"
    packagingOptions.doNotStrip "*/armeabi-v7a/libdu.so"
    packagingOptions.doNotStrip "*/x86/libdu.so"
}

