// ============ Maven 发布配置 ============
afterEvaluate {
    publishing {
        publications {
            // Release 版本
            lawnWithQuickstepPlayRelease(MavenPublication) {
                from components.findByName('lawnWithQuickstepPlayRelease')

                groupId = 'com.lawnchair'
                artifactId = 'launcher-sdk'
                version = '1.0.23'

                pom {
                    name = 'Lawnchair Launcher SDK'
                    description = 'Lawnchair Launcher SDK for third-party integration'
                }
            }

            // Debug 版本
            lawnWithQuickstepPlayDebug(MavenPublication) {
                from components.findByName('lawnWithQuickstepPlayDebug')

                groupId = 'com.lawnchair'
                artifactId = 'launcher-sdk-debug'
                version = '1.0.23'

                pom {
                    name = 'Lawnchair Launcher SDK (Debug)'
                    description = 'Lawnchair Launcher SDK for third-party integration (Debug version)'
                }
            }
        }

        repositories {
            maven {
                name = 'localRepo'
                url = uri("${rootProject.buildDir}/repo")
            }
        }
    }
}

subprojects {
    plugins.withId('com.android.library') {
        apply plugin: 'maven-publish'

        android {
            publishing {
                singleVariant("release") {
                    withSourcesJar()
                }
            }
        }

        afterEvaluate {
            // Configure duplicates strategy for sourcesJar task if it exists
            tasks.withType(Jar).configureEach {
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            }

            publishing {
                publications {
                    // Check if the 'release' component exists before trying to access it
                    if (components.findByName('release')) {
                        release(MavenPublication) {
                            from components.release

                            groupId = 'com.lawnchair'
                            artifactId = project.name
                            version = '1.0.23'
                        }
                    }
                }

                repositories {
                    maven {
                        name = 'localRepo'
                        url = uri("${rootProject.buildDir}/repo")
                    }
                }
            }
        }
    }
}
